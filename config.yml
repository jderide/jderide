baseURL: "https://jderide.com/"
title: Julio Deride
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: Research
          url: research/
          weight: 1
        - name: Projects
          url: projects/
          weight: 2
        - name: Teaching
          url: teaching/
          weight: 3
        - name: Consulting
          url: consulting/
          weight: 4
        - name: CV
          url: cv/
          weight: 5

params:
    description: "Applied mathematician and consultant in stochastic optimization and equilibrium modeling. Assistant Professor at Universidad Adolfo Ibáñez, Santiago, Chile."
    author: Julio Deride
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: false
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["research","projects","teaching","consulting"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: false
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Julio Deride, PhD
          subtitle: "I am an Assistant Professor at the Faculty of Engineering and Science at Universidad Adolfo Ibáñez, Santiago, Chile. My research develops methods at the intersection of stochastic programming and variational analysis, with applications to energy markets, equilibrium modeling, and financial risk."
          imageUrl: "picture.jpeg"
          imageWidth: 160
          imageHeight: 160
          buttons:
            - name: Research
              url: research/
            - name: Consulting
              url: consulting/
            - name: Projects
              url: projects/
            - name: Teaching
              url: teaching/
            - name: CV
              url: cv/

    socialIcons:
        - name: CV
          url: cv/
        - name: Email
          url: mailto:julio.deride@uai.cl
        - name: Google Scholar
          url: https://scholar.google.com/citations?user=r5oRQroAAAAJ&hl=en
        - name: LinkedIn
          url: https://www.linkedin.com/in/julio-deride
        - name: GitHub
          url: https://github.com/jderide

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Julio Deride"
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2